name: fin

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-America/New_York}   # the daily sync cron uses this timezone
    volumes:
      - ./data:/data                # SQLite DB incl. Plaid access tokens; under /opt/stacks, so Kopia backs it up
    networks:
      - apps
    labels:
      caddy: ${HOSTNAMES:-fin.example.com}
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  apps:
    external: true
