<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#14161c">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Fin · Accounts</title>
<style>
  :root { color-scheme: dark; --bg:#14161c; --card:#1d2029; --fg:#e8eaf0; --muted:#8e95a8; --line:#2c303c; --neg:#ff7b84; --pos:#5fd39a; --accent:#8b8fff; --on-accent:#14161c; }
  * { box-sizing:border-box } body { margin:0; font:14px system-ui,sans-serif; background:var(--bg); color:var(--fg); display:flex; min-height:100vh }
  aside { width:280px; background:var(--card); border-right:1px solid var(--line); padding:16px; flex-shrink:0 }
  main { flex:1; padding:24px; min-width:0 }
  .brand { color:inherit; text-decoration:none } .brand:hover { color:var(--accent) }
  h1 { font-size:18px; margin:0 0 12px } h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:20px 0 6px }
  button { font:inherit; background:var(--accent); color:var(--on-accent); border:0; border-radius:6px; padding:7px 12px; cursor:pointer } button.ghost { background:none; color:var(--accent); border:1px solid var(--line) }
  .acct { display:flex; justify-content:space-between; gap:8px; padding:7px 8px; border-radius:6px; cursor:pointer } .acct:hover,.acct.sel { background:var(--bg) }
  .acct small { color:var(--muted); display:block } .num { font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right }
  .neg { color:var(--neg) } .pos { color:var(--pos) } .muted { color:var(--muted) }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden }
  th,td { padding:8px 12px; text-align:left; border-bottom:1px solid var(--line) } th { color:var(--muted); font-weight:500; font-size:12px } td.num,th.num { text-align:right }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap } .row .grow { flex:1 }
  .owner { font-weight:600; font-size:13px; margin:14px 0 2px; padding:4px 8px; border-radius:6px; display:flex; align-items:center; gap:2px; cursor:pointer }
  .owner .oname { flex:1; min-width:0 } .owner:hover,.owner.sel { background:var(--bg) } .otoggle { padding:2px 4px 2px 0; margin-left:-4px }
  .owner,.grp { cursor:pointer; user-select:none } .chev { display:inline-block; width:14px; color:var(--muted); transition:transform .12s } .collapsed > .chev, .chev.c { transform:rotate(-90deg) }
  .count { font-weight:400; font-size:12px; color:var(--muted); margin-left:6px; font-variant-numeric:tabular-nums; text-transform:none; letter-spacing:0 }
  .grp { display:flex; justify-content:space-between; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:8px 8px 2px }
  .banner { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:16px }
  a.btn { display:inline-block; font:inherit; border-radius:6px; padding:7px 12px; text-decoration:none; line-height:normal; border:1px solid var(--line); color:var(--accent) }
  button.sm { padding:3px 8px; font-size:12px }
  .sync { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:16px; font-size:13px }
  .sync h3 { margin:0 0 6px; font-size:13px } .sync ul { margin:0; padding-left:18px } .sync li { margin:3px 0 }
  dialog { border:1px solid var(--line); border-radius:12px; padding:0; background:var(--card); color:var(--fg); width:min(420px, calc(100vw - 32px)); box-shadow:0 12px 40px rgba(0,0,0,.25) }
  dialog::backdrop { background:rgba(10,12,18,.5) }
  dialog form { padding:20px; display:flex; flex-direction:column; gap:14px } dialog h3 { margin:0; font-size:16px }
  dialog label { display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--muted) }
  dialog input, dialog select { font:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg) }
  dialog input:focus, dialog select:focus { outline:2px solid var(--accent); outline-offset:-1px }
  dialog .hint { font-size:12px; color:var(--muted); margin-top:-6px } dialog .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:4px }
  .search { position:relative; max-width:380px; margin:0 0 10px } .searchrow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px }
  .search input { width:100%; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg) } .search input:focus { outline:2px solid var(--accent); outline-offset:-1px }
  .plist { position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:20; background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.2); max-height:340px; overflow:auto; padding:4px }
  .popt { display:flex; justify-content:space-between; gap:12px; padding:7px 10px; border-radius:6px; cursor:pointer } .popt.active { background:var(--bg) } .popt .n { color:var(--muted); font-variant-numeric:tabular-nums }
  .popt mark { background:none; color:var(--accent); font-weight:600 } .pnote { padding:7px 10px; color:var(--muted); font-size:12px }
  .chip { display:inline-flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:99px; padding:3px 6px 3px 12px; font-size:13px }
  .chip button { background:none; color:var(--muted); border:0; padding:0 6px; font-size:16px; line-height:1; cursor:pointer }
  .err { color:var(--neg); font-size:12px } .pending { opacity:.55 }
  @media (max-width:700px) { body { flex-direction:column } aside { width:auto; border-right:0; border-bottom:1px solid var(--line) } }
</style>
</head>
<body>
<aside>
  <h1><a href="/" class="brand">Fin</a></h1>
  <div class="row"><button id="link">+ Connect bank</button><button class="ghost" id="sync">Sync now</button><a href="/connections.html" class="btn ghost">Connections</a></div>
  <div class="row" style="margin:0 0 4px"><button class="ghost sm" id="expandall">Expand all</button><button class="ghost sm" id="collapseall">Collapse all</button></div>
  <div id="accounts"></div>
</aside>
<main id="main"><div id="syncpanel"></div><div id="content"></div></main>
<dialog id="editdlg">
  <form method="dialog" id="editform">
    <h3 id="edtitle">Edit account</h3>
    <label>Owner<input id="edowner" list="owners" autocomplete="off" placeholder="Detected automatically"></label>
    <datalist id="owners"></datalist>
    <div class="hint" id="edhint"></div>
    <label>Group<select id="edgroup"></select></label>
    <div class="err" id="ederr" hidden></div>
    <div class="actions">
      <button type="button" class="ghost" id="edcancel">Cancel</button>
      <button type="submit" id="edsave">Save</button>
    </div>
  </form>
</dialog>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const fmt = (n) => n == null ? "—" : n.toLocaleString("en-US", { style: "currency", currency: "USD" });
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const api = async (path, opts) => { const r = await fetch(path, opts); const j = await r.json(); if (!r.ok) throw new Error(j.error); return j; };
// Credit/loan balances are amounts owed; show them as negative.
const bal = (a) => a.current_balance == null ? null : (a.type === "credit" || a.type === "loan" ? -a.current_balance : a.current_balance);
const cls = (n) => n < 0 ? "neg" : "";

const cmp = (a, b) => String(a ?? "").localeCompare(String(b ?? ""), undefined, { numeric: true, sensitivity: "base" }); // case-insensitive, "Card 2" < "Card 10"
let accounts = [], selected = null;

async function load() {
  accounts = await api("/api/accounts");
  if (!selected && location.hash.length > 1) selected = decodeURIComponent(location.hash.slice(1));
  const exists = selected && (selected.startsWith("o:") ? accounts.some((a) => "o:" + a.owner === selected) : accounts.some((a) => a.account_id === selected));
  if (!exists) { const first = ownerList()[0]; selected = first ? "o:" + first : null; }
  renderSidebar();
  if (selected) select(selected); else $("#content").innerHTML = '<p class="muted">No accounts yet. Connect a bank to get started.</p>';
}

const ownerList = () => [...new Set(accounts.map((a) => a.owner))].sort((a, b) =>
  (a === "Unassigned") - (b === "Unassigned") || cmp(a, b));

const GROUP_ORDER = ["Checking", "Savings", "HSA", "Credit Cards", "Loans", "Brokerage", "401(k)", "Retirement", "Education", "Other"];
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const sum = (list) => list.reduce((s, a) => s + (bal(a) ?? 0), 0);
const groupRank = (g) => { const i = GROUP_ORDER.indexOf(g); return i < 0 ? 99 : i; };

function acctRow(a) {
  return `<div class="acct ${selected === a.account_id ? "sel" : ""}" data-id="${esc(a.account_id)}">
      <span>${esc(a.name)}<small>${esc(a.institution)}${a.multiple_connections && a.connection ? " (" + esc(a.connection) + ")" : ""}${a.mask ? " ··" + esc(a.mask) : ""}</small></span>
      <span class="num ${cls(bal(a))}">${fmt(bal(a))}</span>
    </div>`;
}

// Collapsed owners/groups persist across reloads (best-effort: storage may be unavailable).
let collapsed = new Set();
try { collapsed = new Set(JSON.parse(localStorage.getItem("collapsed") ?? "[]")); } catch {}
const saveCollapsed = () => { try { localStorage.setItem("collapsed", JSON.stringify([...collapsed])); } catch {} };
const toggle = (key) => { collapsed.has(key) ? collapsed.delete(key) : collapsed.add(key); saveCollapsed(); renderSidebar(); };
const chev = (key) => `<span class="chev ${collapsed.has(key) ? "c" : ""}">▾</span>`;

function renderSidebar() {
  // Owner -> account group -> accounts. "Unassigned" sorts last. Totals stay visible when collapsed.
  let html = "";
  for (const owner of ownerList()) {
    const mine = accounts.filter((a) => a.owner === owner), ok = "o:" + owner;
    const groups = [...new Set(mine.map((a) => a.group))].sort((a, b) => groupRank(a) - groupRank(b) || cmp(a, b));
    html += `<div class="owner ${selected === ok ? "sel" : ""}" role="button" tabindex="0" data-owner="${esc(ok)}" title="Show all transactions for ${esc(owner)}">
      <span class="otoggle" role="button" tabindex="0" aria-label="${collapsed.has(ok) ? "Expand" : "Collapse"} ${esc(owner)}" aria-expanded="${!collapsed.has(ok)}" data-toggle="${esc(ok)}">${chev(ok)}</span>
      <span class="oname">${esc(owner)}${collapsed.has(ok) ? `<span class="count">${mine.length}</span>` : ""}</span><span class="num ${cls(sum(mine))}">${fmt(sum(mine))}</span></div>`;
    if (collapsed.has(ok)) continue;
    for (const g of groups) {
      const list = mine.filter((a) => a.group === g).sort((x, y) => cmp(x.name, y.name) || cmp(x.mask, y.mask)), gk = `g:${owner}|${g}`;
      html += `<div class="grp" role="button" tabindex="0" aria-expanded="${!collapsed.has(gk)}" data-toggle="${esc(gk)}">
        <span>${chev(gk)}${esc(g)}${list.every((a) => a.type === "investment") ? " (balance only)" : ""}${collapsed.has(gk) ? `<span class="count">${list.length}</span>` : ""}</span><span class="num">${fmt(sum(list))}</span></div>`;
      if (!collapsed.has(gk)) html += list.map(acctRow).join("");
    }
  }
  $("#accounts").innerHTML = html;
  document.querySelectorAll(".acct").forEach((el) => el.onclick = () => select(el.dataset.id));
  // Chevron / group header toggles collapse; clicking the owner row itself shows that owner's transactions.
  document.querySelectorAll("[data-toggle]").forEach((el) => {
    el.onclick = (ev) => { ev.stopPropagation(); toggle(el.dataset.toggle); };
    el.onkeydown = (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); ev.stopPropagation(); toggle(el.dataset.toggle); } };
  });
  document.querySelectorAll("[data-owner]").forEach((el) => {
    el.onclick = () => select(el.dataset.owner);
    el.onkeydown = (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(el.dataset.owner); } };
  });
}

function setAllCollapsed(collapse) {
  collapsed = new Set();
  if (collapse) for (const a of accounts) collapsed.add("o:" + a.owner);
  saveCollapsed(); renderSidebar();
}

// Edit dialog: blank owner / "Automatic" group clears the manual override.
function editAccount(a) {
  const dlg = $("#editdlg"), owner = $("#edowner"), group = $("#edgroup"), err = $("#ederr");
  $("#edtitle").textContent = a.name;
  owner.value = a.owner_override ?? "";
  owner.placeholder = a.owner_detected ? `Detected: ${a.owner_detected}` : "No owner detected";
  $("#edhint").textContent = "Leave blank to use the detected owner.";
  $("#owners").innerHTML = [...new Set(accounts.map((x) => x.owner).filter((o) => o !== "Unassigned"))].sort(cmp).map((o) => `<option value="${esc(o)}">`).join("");
  group.innerHTML = `<option value="">Automatic</option>` + GROUP_ORDER.map((g) => `<option ${a.group_override === g ? "selected" : ""}>${g}</option>`).join("");
  err.hidden = true;
  dlg.showModal();
  owner.focus();
  return new Promise((resolve) => {
    const form = $("#editform"), cancel = $("#edcancel");
    const finish = () => { form.onsubmit = null; cancel.onclick = null; dlg.onclose = null; resolve(); };
    cancel.onclick = () => dlg.close();
    dlg.onclose = finish;
    form.onsubmit = async (ev) => {
      ev.preventDefault();
      const save = $("#edsave"); save.disabled = true;
      try {
        await api("/api/accounts/" + encodeURIComponent(a.account_id), { method: "PATCH", headers: { "content-type": "application/json" },
          body: JSON.stringify({ owner: owner.value, group: group.value }) });
        dlg.close(); await load();
      } catch (e) { err.textContent = e.message; err.hidden = false; }
      save.disabled = false;
    };
  });
}

// Items linked before owner detection existed must grant Identity consent via Link update mode.
function consentBanner() {
  const items = [...new Map(accounts.filter((a) => a.identity_status === "needs_consent").map((a) => [a.item_id, a.institution])).entries()];
  return items.map(([id, name]) => `<div class="banner">Owner detection needs permission for <b>${esc(name)}</b>.
    <button class="sm" data-consent="${esc(id)}">Enable</button></div>`).join("");
}

// Register: 100 rows at a time (lazy), optionally filtered by payee. Filter resets when the selection changes.
let regObserver = null, regSeq = 0, regId = null, regFilter = { payee: "", q: "" };
const scopeParams = (id) => id.startsWith("o:") ? "owner=" + encodeURIComponent(id.slice(2)) : "account=" + encodeURIComponent(id);
const txUrl = (id, cur) => "/api/transactions?limit=100&" + scopeParams(id) +
  (regFilter.payee ? "&payee=" + encodeURIComponent(regFilter.payee) : "") + (regFilter.q ? "&q=" + encodeURIComponent(regFilter.q) : "") +
  (cur ? `&before_date=${encodeURIComponent(cur.date)}&before_id=${encodeURIComponent(cur.id)}` : "");

function lazyLoad(id, seq, first, row) {
  const sentinel = $("#txmore"), body = $("#txbody");
  let next = first.next, loaded = first.rows.length, loading = false;
  const status = () => { sentinel.textContent = next ? "" : loaded ? `${loaded.toLocaleString()} transaction${loaded === 1 ? "" : "s"}` : ""; };
  status();
  if (!next) return;
  async function more() {
    if (!next || loading) return;
    loading = true; sentinel.textContent = "Loading…";
    try {
      const page = await api(txUrl(id, next));
      if (seq !== regSeq) return;
      body.insertAdjacentHTML("beforeend", page.rows.map(row).join(""));
      loaded += page.rows.length; next = page.next; status();
    } catch (e) { if (seq === regSeq) sentinel.innerHTML = `Couldn't load more. <a href="#" id="retry">Retry</a>`; $("#retry")?.addEventListener("click", (ev) => { ev.preventDefault(); loading = false; more(); }); return; }
    finally { loading = false; }
    // Re-observe so a sentinel that is still in view (short page / tall window) triggers the next load.
    if (next && seq === regSeq) { regObserver.unobserve(sentinel); regObserver.observe(sentinel); } else regObserver.disconnect();
  }
  regObserver = new IntersectionObserver((entries) => { if (entries.some((e) => e.isIntersecting)) more(); }, { rootMargin: "400px" });
  regObserver.observe(sentinel);
}

// Payee search box: typeahead listing distinct payees with counts. Enter on a highlighted payee filters to exactly that
// payee; Enter with plain text filters to any transaction containing it.
function wireSearch(id, reload) {
  const input = $("#payeeq"), list = $("#payeelist");
  let opts = [], active = -1, timer = 0, reqSeq = 0;
  const close = () => { list.hidden = true; input.setAttribute("aria-expanded", "false"); active = -1; input.removeAttribute("aria-activedescendant"); };
  const mark = (name, q) => {
    const i = q ? name.toLowerCase().indexOf(q.toLowerCase()) : -1;
    return i < 0 ? esc(name) : esc(name.slice(0, i)) + "<mark>" + esc(name.slice(i, i + q.length)) + "</mark>" + esc(name.slice(i + q.length));
  };
  const setActive = (i) => {
    active = i; list.querySelectorAll(".popt").forEach((el, n) => { el.classList.toggle("active", n === i); el.setAttribute("aria-selected", n === i); });
    if (i >= 0) { input.setAttribute("aria-activedescendant", "popt" + i); list.querySelector("#popt" + i)?.scrollIntoView({ block: "nearest" }); } else input.removeAttribute("aria-activedescendant");
  };
  const apply = (f) => { regFilter = f; input.value = ""; close(); renderChip(); reload(); };
  async function refresh() {
    const q = input.value.trim(), my = ++reqSeq;
    let data; try { data = await api(`/api/payees?limit=12&${scopeParams(id)}&q=${encodeURIComponent(q)}`); } catch { return; }
    if (my !== reqSeq) return;
    opts = data.payees; active = -1;
    list.innerHTML = opts.map((p, n) => `<div class="popt" role="option" id="popt${n}" data-n="${n}" aria-selected="false"><span>${mark(p.payee, q)}</span><span class="n">${p.count.toLocaleString()}</span></div>`).join("") +
      (data.total > opts.length ? `<div class="pnote">${(data.total - opts.length).toLocaleString()} more — keep typing to narrow</div>` : "") +
      (!opts.length ? `<div class="pnote">No matching payees${q ? ` — press Enter to search “${esc(q)}”` : ""}</div>` : "");
    list.hidden = false; input.setAttribute("aria-expanded", "true");
    list.querySelectorAll(".popt").forEach((el) => el.onmousedown = (ev) => { ev.preventDefault(); apply({ payee: opts[+el.dataset.n].payee, q: "" }); });
  }
  input.oninput = () => { clearTimeout(timer); timer = setTimeout(refresh, 120); };
  input.onfocus = refresh;
  input.onblur = close;
  input.onkeydown = (ev) => {
    if (ev.key === "ArrowDown") { ev.preventDefault(); if (list.hidden) return refresh(); setActive(Math.min(active + 1, opts.length - 1)); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); setActive(Math.max(active - 1, 0)); }
    else if (ev.key === "Enter") { ev.preventDefault(); const q = input.value.trim(); if (active >= 0) apply({ payee: opts[active].payee, q: "" }); else if (q) apply({ payee: "", q }); }
    else if (ev.key === "Escape") { if (!list.hidden) close(); else input.value = ""; }
  };
}

function renderChip() {
  const el = $("#filterchip"); if (!el) return;
  const label = regFilter.payee ? `Payee: <b>${esc(regFilter.payee)}</b>` : regFilter.q ? `Contains: <b>${esc(regFilter.q)}</b>` : "";
  el.innerHTML = label ? `<span class="chip">${label}<button aria-label="Clear filter" id="clearfilter">×</button></span>` : "";
  if (label) $("#clearfilter").onclick = () => { regFilter = { payee: "", q: "" }; renderChip(); $("#reloadreg")?.click(); };
}

async function select(id) {
  selected = id; renderSidebar();
  const owner = id.startsWith("o:") ? id.slice(2) : null;
  const acct = owner === null ? accounts.find((a) => a.account_id === id) : undefined;
  if (acct?.type === "investment") {
    $("#content").innerHTML = consentBanner() + `<h1>${esc(acct.name)} <button class="ghost sm" id="edit">Edit owner/group</button></h1><p class="muted">${esc(acct.institution)} · ${esc(acct.owner)} · ${esc(acct.group)}</p>
      <p style="font-size:28px" class="num">${fmt(acct.current_balance)}</p>
      <p class="muted">Current value as of ${new Date(acct.updated_at).toLocaleString()}. Transaction register is not shown for brokerage accounts.</p>`;
    wireMain(acct);
    return;
  }
  if (regId !== id) { regFilter = { payee: "", q: "" }; regId = id; }
  regObserver?.disconnect();
  const names = Object.fromEntries(accounts.map((a) => [a.account_id, a.name]));
  const errs = [...new Set(accounts.filter((a) => a.last_error).map((a) => a.institution + ": " + a.last_error))];
  const synced = accounts.map((a) => a.last_synced).filter(Boolean).sort().pop();
  const row = (t) => { const amt = -t.amount; /* Plaid: positive = money out */
    return `<tr class="${t.pending ? "pending" : ""}"><td>${t.date}</td>${acct ? "" : `<td>${esc(names[t.account_id])}</td>`}
      <td>${esc(t.merchant || t.name)}${t.pending ? " (pending)" : ""}</td><td class="muted">${esc((t.category || "").replace(/_/g, " ").toLowerCase())}</td>
      <td class="num ${cls(amt)}">${fmt(amt)}</td></tr>`; };
  $("#content").innerHTML = consentBanner() + `<h1>${acct ? esc(acct.name) : esc(owner)}${acct ? ' <button class="ghost sm" id="edit">Edit owner/group</button>' : ""}</h1>
    ${acct ? `<p class="muted">${esc(acct.institution)} · ${esc(acct.owner)} · ${esc(acct.group)}</p>`
      : `<p class="muted">${plural(accounts.filter((a) => a.owner === owner).length, "account")}</p>`}
    <p class="muted">${synced ? "Last synced " + new Date(synced).toLocaleString() : "Not synced yet"}</p>
    ${errs.map((e) => `<p class="err">${esc(e)}</p>`).join("")}
    <div class="searchrow"><div class="search" style="margin:0;flex:1;min-width:220px">
      <input id="payeeq" role="combobox" aria-expanded="false" aria-controls="payeelist" aria-autocomplete="list" autocomplete="off" placeholder="Search payee…">
      <div class="plist" id="payeelist" role="listbox" hidden></div></div><div id="filterchip"></div><button id="reloadreg" hidden></button></div>
    <table><thead><tr><th>Date</th>${acct ? "" : "<th>Account</th>"}<th>Payee</th><th>Category</th><th class="num">Amount</th></tr></thead>
    <tbody id="txbody"></tbody></table>
    <div id="txmore" class="muted" style="text-align:center;padding:14px;font-size:12px"></div>`;
  async function reload() {
    regObserver?.disconnect();
    const seq = ++regSeq;
    $("#txmore").textContent = "Loading…";
    let first; try { first = await api(txUrl(id, null)); } catch (e) { if (seq === regSeq) $("#txmore").textContent = "Couldn't load transactions: " + e.message; return; }
    if (seq !== regSeq) return; // a newer request superseded this one
    $("#txbody").innerHTML = first.rows.map(row).join("") ||
      `<tr><td colspan="${acct ? 4 : 5}" class="muted">${regFilter.payee || regFilter.q ? "No matching transactions." : "No transactions yet."}</td></tr>`;
    lazyLoad(id, seq, first, row);
  }
  $("#reloadreg").onclick = reload;
  wireSearch(id, reload); renderChip(); wireMain(acct);
  await reload();
}

function wireMain(acct) {
  if (acct) $("#edit").onclick = () => editAccount(acct).catch((e) => alert(e.message));
  document.querySelectorAll("[data-consent]").forEach((b) => b.onclick = async () => {
    try { const { link_token } = await api("/api/link-token", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ item_id: b.dataset.consent }) });
      openLink(link_token, undefined, b.dataset.consent); } catch (e) { alert(e.message); }
  });
}

function openLink(token, receivedRedirectUri, updateItemId) {
  // Persist enough context to resume after an OAuth redirect.
  if (!receivedRedirectUri) localStorage.setItem("link_ctx", JSON.stringify({ token, updateItemId: updateItemId ?? null }));
  const done = () => { localStorage.removeItem("link_ctx"); history.replaceState({}, "", "/accounts.html"); };
  Plaid.create({
    token, receivedRedirectUri,
    onSuccess: async (public_token, meta) => {
      done();
      try {
        if (updateItemId) await api("/api/item-updated", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ item_id: updateItemId }) });
        else { $("#link").textContent = "Syncing…";
          await api("/api/exchange", { method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ public_token, institution: meta.institution?.name }) }); }
      } catch (e) { alert(e.message); }
      $("#link").textContent = "+ Connect bank"; load();
    },
    onExit: done,
  }).open();
}

$("#link").onclick = async () => {
  try { const { link_token } = await api("/api/link-token", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
    openLink(link_token); } catch (e) { alert(e.message); }
};
$("#expandall").onclick = () => setAllCollapsed(false);
$("#collapseall").onclick = () => setAllCollapsed(true);
const panel = $("#syncpanel");
function showSync(state) {
  const rows = Object.entries(state.items).map(([name, it]) => {
    const r = it.result;
    const line = r
      ? (r.ok ? `✓ ${plural(r.accounts, "account")} · ${r.added} new, ${r.modified} updated, ${r.removed} removed transactions` +
          (r.brokerageAccounts ? ` · ${plural(r.brokerageAccounts, "brokerage account")} (balance only)` : "") +
          (r.ownersDetected ? ` · ${plural(r.ownersDetected, "owner")} detected` : "")
        : `✗ ${esc(r.error)}`)
      : esc(it.detail || "waiting…");
    return `<li><b>${esc(name)}</b>: ${line}</li>`;
  }).join("");
  panel.innerHTML = `<div class="sync"><h3>${state.finished ? "Sync complete" : "Syncing…"}</h3><ul>${rows}</ul></div>`;
}
$("#sync").onclick = async () => {
  const btn = $("#sync"); btn.disabled = true; btn.textContent = "Syncing…";
  const state = { items: {}, finished: false };
  try {
    const r = await fetch("/api/sync", { method: "POST" });
    if (!r.ok) throw new Error((await r.json()).error);
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).replace(/^data: /, ""); buf = buf.slice(i + 2);
        const e = JSON.parse(line);
        if (e.event === "start") e.institutions.forEach((n) => state.items[n] = {});
        else if (e.event === "phase") state.items[e.institution] = { ...state.items[e.institution], detail: e.detail };
        else if (e.event === "item_done") state.items[e.result.institution] = { result: e.result };
        else if (e.event === "done") state.finished = true;
        else if (e.event === "error") throw new Error(e.error);
        showSync(state);
      }
    }
    state.finished = true; showSync(state);
  } catch (e) { panel.innerHTML = `<div class="sync err">Sync failed: ${esc(e.message)}</div>`; }
  btn.disabled = false; btn.textContent = "Sync now"; load();
};

load();
// Resume Link after an OAuth bank redirects back to us.
// (The home page forwards OAuth returns here, stashing the full redirect URL Plaid needs.)
let oauthReturn = null;
try { oauthReturn = localStorage.getItem("link_redirect"); localStorage.removeItem("link_redirect"); } catch {}
if (oauthReturn || location.search.includes("oauth_state_id")) {
  try { const c = JSON.parse(localStorage.getItem("link_ctx") ?? "null");
    if (c) openLink(c.token, oauthReturn || location.href, c.updateItemId ?? undefined); } catch {}
}
</script>
</body>
