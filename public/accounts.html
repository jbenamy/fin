<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#14161c">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Fin · Accounts</title>
<link rel="stylesheet" href="/shared.css">
<style>
  body { display:flex; min-height:100vh }
  aside { width:280px; background:var(--card); border-right:1px solid var(--line); padding:16px; flex-shrink:0; position:sticky; top:0; align-self:flex-start; height:100vh; display:flex; flex-direction:column }
  #accounts { flex:1; min-height:0; overflow-y:auto; margin:0 -8px; padding:0 8px }
  .side-foot { padding-top:12px; margin-top:12px; border-top:1px solid var(--line) } .side-foot .btn { display:block; text-align:center }
  main { flex:1; padding:24px; min-width:0 }
  h1 { font-size:18px; margin:0 0 12px }
  .acct { display:flex; justify-content:space-between; gap:8px; padding:7px 8px; border-radius:6px; cursor:pointer } .acct:hover,.acct.sel { background:var(--bg) }
  .acct small { color:var(--muted); display:block }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden }
  th,td { padding:8px 12px; text-align:left; border-bottom:1px solid var(--line) } th { color:var(--muted); font-weight:500; font-size:12px } td.num,th.num { text-align:right }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap }
  .owner { font-weight:600; font-size:13px; margin:14px 0 2px; padding:4px 8px; border-radius:6px; display:flex; align-items:center; gap:2px }
  .owner .oname { flex:1; min-width:0 } .owner:hover,.owner.sel { background:var(--bg) } .otoggle { padding:2px 4px 2px 0; margin-left:-4px }
  .owner,.grp { cursor:pointer; user-select:none } .chev { display:inline-flex; align-items:center; justify-content:center; width:16px; margin-right:2px; vertical-align:-3px; color:var(--muted) } .owner:hover .chev, .grp:hover .chev { color:var(--fg) }
  .ic { width:14px; height:14px; flex:none; fill:none; stroke:currentColor; stroke-width:2.25; stroke-linecap:round; stroke-linejoin:round }
  button .ic { vertical-align:-2px; margin-right:5px }
  .count { font-weight:400; font-size:12px; color:var(--muted); margin-left:6px; font-variant-numeric:tabular-nums; text-transform:none; letter-spacing:0 }
  .grp { display:flex; justify-content:space-between; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:8px 8px 2px }
  .banner { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:16px }
  .sync { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:16px; font-size:13px }
  .sync h3 { margin:0 0 6px; font-size:13px } .sync ul { margin:0; padding-left:18px } .sync li { margin:3px 0 }
  .search { position:relative; max-width:380px; margin:0 0 10px } .searchrow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px }
  .search input { width:100%; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg) } .search input:focus { outline:2px solid var(--accent); outline-offset:-1px }
  .plist { position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:20; background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.2); max-height:340px; overflow:auto; padding:4px }
  .popt { display:flex; justify-content:space-between; gap:12px; padding:7px 10px; border-radius:6px; cursor:pointer } .popt.active { background:var(--bg) } .popt .n { color:var(--muted); font-variant-numeric:tabular-nums }
  .popt mark { background:none; color:var(--accent); font-weight:600 } .pnote { padding:7px 10px; color:var(--muted); font-size:12px }
  .chip { display:inline-flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:99px; padding:3px 6px 3px 12px; font-size:13px }
  .chip button { background:none; color:var(--muted); border:0; padding:0 6px; font-size:16px; line-height:1; cursor:pointer }
  .pending { opacity:.55 }
  @media (max-width:700px) { body { flex-direction:column } aside { width:auto; position:static; height:auto; align-self:stretch; border-right:0; border-bottom:1px solid var(--line) } #accounts { max-height:50vh } }
</style>
</head>
<body>
<aside>
  <h1><a href="/" class="brand">Fin</a></h1>
  <div class="row"><button id="link">+ Connect bank</button><button class="ghost" id="sync">Sync now</button></div>
  <div class="row" style="margin:0 0 4px"><button class="ghost sm" id="expandall"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>Expand all</button><button class="ghost sm" id="collapseall"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/></svg>Collapse all</button></div>
  <div id="accounts"></div>
  <div class="side-foot"><a href="/connections" class="btn">Connections</a></div>
</aside>
<main id="main"><div id="syncpanel"></div><div id="content"></div></main>
<dialog id="editdlg">
  <form method="dialog" id="editform">
    <h3 id="edtitle">Edit account</h3>
    <label>Owner<input id="edowner" list="owners" autocomplete="off" placeholder="Detected automatically"></label>
    <datalist id="owners"></datalist>
    <div class="hint" id="edhint"></div>
    <label>Group<select id="edgroup"></select></label>
    <div class="err" id="ederr" hidden></div>
    <div class="actions">
      <button type="button" class="ghost" data-cancel>Cancel</button>
      <button type="submit" id="edsave">Save</button>
    </div>
  </form>
</dialog>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<script type="module" src="/js/accounts.js"></script>
</body>
</html>
