<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#14161c">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Fin</title>
<link rel="stylesheet" href="/shared.css">
<style>
  body { padding:24px 16px 48px }
  .wrap { max-width:1100px; margin:0 auto }
  .nav { display:flex; align-items:center; gap:10px; margin-bottom:28px }
  .brand { font-weight:700; font-size:20px; margin-right:auto }

  /* Headline: one hero figure + a row of stat tiles */
  .hero { margin-bottom:6px } .hero .label { color:var(--muted); font-size:14px }
  .hero .value { font-size:56px; font-weight:600; line-height:1.1; letter-spacing:-.02em; margin:2px 0 4px }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; margin:18px 0 26px }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px }
  .tile .label { color:var(--muted); font-size:13px } .tile .value { font-size:24px; font-weight:600; margin-top:2px }
  .tile .sub { color:var(--muted); font-size:12px; margin-top:2px }

  .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px 20px; flex-wrap:wrap; margin:0 0 22px }
  .filters { display:flex; gap:6px; flex-wrap:wrap }
  .toggle { display:inline-flex; align-items:center; gap:8px; color:var(--muted); cursor:pointer; margin-left:auto }
  .chip { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:99px; padding:5px 14px; cursor:pointer }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--on-accent) }

  .owner { display:flex; align-items:baseline; gap:12px; margin:30px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line) }
  .owner h2 { font-size:16px; margin:0; flex:1 } .owner .total { font-size:16px; font-weight:600 }
  .grp { display:flex; justify-content:space-between; gap:12px; margin:18px 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted) }
  .grp .total { font-variant-numeric:tabular-nums }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px }
  a.card { display:flex; flex-direction:column; gap:2px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; color:inherit; text-decoration:none; min-height:128px }
  a.card:hover { border-color:var(--accent) } a.card:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
  .card .name { font-weight:600; overflow-wrap:anywhere } .card .where { color:var(--muted); font-size:12px; overflow-wrap:anywhere }
  .card .value { font-size:26px; font-weight:600; margin-top:auto; padding-top:12px }
  .card .foot { color:var(--muted); font-size:12px; min-height:1.4em; margin-top:2px }
  .empty { text-align:center; padding:60px 0; color:var(--muted) }
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a href="/" class="brand">Fin</a>
    <a href="/accounts" class="btn">Accounts</a>
    <a href="/connections" class="btn">Connections</a>
  </nav>
  <div id="app"><p class="muted">Loading…</p></div>
</div>
<script type="module" src="/js/home.js"></script>
</body>
</html>
