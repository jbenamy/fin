<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#14161c">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Fin</title>
<link rel="stylesheet" href="/shared.css">
<style>
  body { padding:24px 16px 48px }
  .wrap { max-width:1100px; margin:0 auto }
  .nav { display:flex; align-items:center; gap:10px; margin-bottom:28px }
  .brand { font-weight:700; font-size:20px; margin-right:auto }

  /* Headline: one hero figure + a row of stat tiles */
  .hero { margin-bottom:6px } .hero .label { color:var(--muted); font-size:14px }
  .hero .value { font-size:56px; font-weight:600; line-height:1.1; letter-spacing:-.02em; margin:2px 0 4px }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; margin:18px 0 26px }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px }
  .tile .label { color:var(--muted); font-size:13px } .tile .value { font-size:24px; font-weight:600; margin-top:2px }
  .tile .sub { color:var(--muted); font-size:12px; margin-top:2px }

  .filters { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 22px }
  .chip { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:99px; padding:5px 14px; cursor:pointer }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--on-accent) }

  .owner { display:flex; align-items:baseline; gap:12px; margin:30px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line) }
  .owner h2 { font-size:16px; margin:0; flex:1 } .owner .total { font-size:16px; font-weight:600 }
  .grp { display:flex; justify-content:space-between; gap:12px; margin:18px 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted) }
  .grp .total { font-variant-numeric:tabular-nums }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px }
  a.card { display:flex; flex-direction:column; gap:2px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; color:inherit; text-decoration:none; min-height:128px }
  a.card:hover { border-color:var(--accent) } a.card:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
  .card .name { font-weight:600; overflow-wrap:anywhere } .card .where { color:var(--muted); font-size:12px; overflow-wrap:anywhere }
  .card .value { font-size:26px; font-weight:600; margin-top:auto; padding-top:12px }
  .card .foot { color:var(--muted); font-size:12px; min-height:1.4em; margin-top:2px }
  .empty { text-align:center; padding:60px 0; color:var(--muted) }
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a href="/" class="brand">Fin</a>
    <a href="/accounts" class="btn">Accounts</a>
    <a href="/connections" class="btn">Connections</a>
  </nav>
  <div id="app"><p class="muted">Loading…</p></div>
</div>
<script type="module">
import { $, esc, cmp, plural, usd, sum, ownerList, api } from "/shared.js";
let accounts = [], owner = null; // owner === null means everyone

function tile(label, value, sub) {
  return `<div class="tile"><div class="label">${label}</div><div class="value">${usd(value)}</div><div class="sub">${sub}</div></div>`;
}

function card(a, multi) {
  const where = [a.institution, multi.has(a.institution) && a.connection ? a.connection : null].filter(Boolean).join(" · ") + (a.mask ? ` ··${a.mask}` : "");
  const sub = a.kind === "investment" ? "balance only" : a.kind === "debt" ? "owed" :
    a.available != null && a.available !== a.balance ? `${usd(a.available)} available` : "";
  const href = "/accounts#" + encodeURIComponent(a.account_id);
  return `<a class="card" href="${href}" aria-label="${esc(a.name)}, ${usd(a.balance)}">
    <div class="name">${esc(a.name)}</div><div class="where">${esc(where)}</div>
    <div class="value">${usd(a.balance)}</div>
    <div class="foot">${esc(sub)}</div></a>`;
}

function render() {
  if (!accounts.length) {
    $("#app").innerHTML = `<div class="empty">No accounts yet. <a href="/accounts">Connect a bank</a> to get started.</div>`;
    return;
  }
  const owners = ownerList(accounts);
  const shown = owner ? accounts.filter((a) => a.owner === owner) : accounts;
  const cash = shown.filter((a) => a.kind === "cash"), inv = shown.filter((a) => a.kind === "investment"), debt = shown.filter((a) => a.kind === "debt");
  const updated = accounts.map((a) => a.updated_at).filter(Boolean).sort().pop();
  // Institutions that appear under more than one login need the connection label to tell their cards apart.
  const multi = new Set(accounts.filter((a) => a.multiple_connections).map((a) => a.institution));

  const filters = owners.length > 1 ? `<div class="filters" role="group" aria-label="Filter by owner">
    ${[null, ...owners].map((o) => `<button class="chip" aria-pressed="${owner === o}" data-owner="${esc(o ?? "")}">${o === null ? "Everyone" : esc(o)}</button>`).join("")}</div>` : "";

  // Owner -> account type (same order as the sidebar) -> cards.
  const sections = (owner ? [owner] : owners).map((o) => {
    const mine = shown.filter((a) => a.owner === o);
    const types = [...new Set(mine.map((a) => a.group))]
      .sort((x, y) => mine.find((a) => a.group === x).group_rank - mine.find((a) => a.group === y).group_rank || cmp(x, y));
    return `<section><div class="owner"><h2>${esc(o)}</h2><span class="muted">${plural(mine.length, "account")}</span><span class="total">${usd(sum(mine))}</span></div>
      ${types.map((g) => {
        const list = mine.filter((a) => a.group === g).sort((x, y) => cmp(x.name, y.name) || cmp(x.mask, y.mask));
        return `<div class="grp"><span>${esc(g)}${list.every((a) => a.kind === "investment") ? " (balance only)" : ""}</span><span class="total">${usd(sum(list))}</span></div>
          <div class="cards">${list.map((a) => card(a, multi)).join("")}</div>`;
      }).join("")}</section>`;
  }).join("");

  $("#app").innerHTML = `
    <div class="hero"><div class="label">Net worth${owner ? ` · ${esc(owner)}` : ""}</div><div class="value">${usd(sum(shown))}</div>
      <div class="muted">${updated ? "Balances as of " + new Date(updated).toLocaleString() : ""}</div></div>
    <div class="tiles">
      ${tile("Cash", sum(cash), plural(cash.length, "account"))}
      ${tile("Investments", sum(inv), plural(inv.length, "account"))}
      ${tile("Owed", sum(debt), plural(debt.length, "account"))}
    </div>${filters}${sections}`;
  document.querySelectorAll("[data-owner]").forEach((b) => b.onclick = () => { owner = b.dataset.owner || null; render(); });
}

api("/api/accounts").then((a) => { accounts = a; render(); })
  .catch((e) => { $("#app").innerHTML = `<p class="err">Couldn't load accounts: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
