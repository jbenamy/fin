<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#14161c">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Fin · Sign in</title>
<link rel="stylesheet" href="/shared.css">
<style>
  body { padding:24px 16px; min-height:100vh; display:flex; align-items:center; justify-content:center }
  .box { width:min(360px, 100%); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px }
  .brand { display:block; font-weight:700; font-size:20px; margin-bottom:14px }
  h1 { font-size:16px; margin:0 0 6px } p { font-size:13px; line-height:1.5; margin:0 0 16px }
  form { display:flex; flex-direction:column; gap:12px }
  label { display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--muted) }
  input { font:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg) }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px }
  button { padding:9px 12px } .err { margin-top:10px; font-size:13px }
</style>
</head>
<body>
<main class="box">
  <a href="/" class="brand">Fin</a>
  <div id="app"><p class="muted">Loading…</p></div>
  <div class="err" id="err" role="alert" hidden></div>
</main>
<script type="module" src="/js/login.js"></script>
</body>
</html>
