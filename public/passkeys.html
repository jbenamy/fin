<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#14161c">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Fin · Passkeys</title>
<link rel="stylesheet" href="/shared.css">
<style>
  body { padding:24px 16px }
  .wrap { max-width:760px; margin:0 auto } .top .actions { flex-wrap:wrap }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:4px 16px 8px }
  table { width:100%; border-collapse:collapse; font-size:13px } th,td { text-align:left; padding:8px; border-top:1px solid var(--line) }
  thead th { border-top:0; color:var(--muted); font-weight:500 } td.c { text-align:right; width:1% }
  .pill { font-size:11px; padding:1px 8px; border-radius:99px; border:1px solid currentColor; color:var(--ok); margin-left:6px }
  #inviteurl { font-family:ui-monospace,monospace; font-size:12px }
  @media (max-width:560px) { .hide-sm { display:none } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><a href="/" class="brand">Fin</a><h1>Passkeys</h1><div class="muted">Any passkey listed here can sign in to Fin.</div></div>
    <div class="actions"><button id="add">Add passkey on this device</button><button class="ghost" id="invite" title="A one-time link to add a passkey on another device">Invite link</button><button class="ghost" id="logout">Sign out</button></div></div>
  <div class="card"><table><thead><tr><th>Name</th><th class="hide-sm">Added</th><th>Last used</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="4" class="muted">Loading…</td></tr></tbody></table></div>
  <div class="err" id="err" hidden></div>
</div>
<dialog id="adddlg"><form method="dialog">
  <h3>Add passkey on this device</h3>
  <label>Name<input id="addlabel" maxlength="60" autocomplete="off" required placeholder="e.g. Sam's laptop"></label>
  <div class="err" id="adderr" hidden></div>
  <div class="actions"><button type="button" class="ghost" data-cancel>Cancel</button><button type="submit" id="addgo">Create passkey</button></div>
</form></dialog>
<dialog id="invitedlg"><form method="dialog">
  <h3>Invite link</h3>
  <label>Open this on the other device to create a passkey there<input id="inviteurl" readonly></label>
  <div class="hint" id="invitehint"></div>
  <div class="actions"><button type="button" class="ghost" data-cancel>Close</button><button type="submit" id="copy">Copy</button></div>
</form></dialog>
<dialog id="rmdlg"><form method="dialog">
  <h3 id="rmtitle">Remove passkey</h3>
  <p style="margin:0;font-size:13px;line-height:1.5">It will no longer sign in to Fin, and browsers signed in with it are signed out. Also delete it from the device's password manager.</p>
  <div class="err" id="rmerr" hidden></div>
  <div class="actions"><button type="button" class="ghost" data-cancel>Cancel</button><button type="submit" class="danger">Remove</button></div>
</form></dialog>
<script type="module" src="/js/passkeys.js"></script>
</body>
</html>
